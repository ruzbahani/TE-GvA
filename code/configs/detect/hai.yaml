releases: ["23.05", "22.04"]
detectors: [zscore, pca, gru]
period_s: 1

eval:
  fa_targets_per_hour: [1.0, 0.25]
  merge_gap: 60
  grace_s: 60
  max_false_alarm_s: 60
  pre_tolerance_s: 60
  fa_unit_s: 60
  smoothing: [1, 10, 30, 60, 120, 300]
  block_s: 3600
  n_boot: 1000
  alpha: 0.05
  boot_seed: 0
  min_ci_clusters: 10

zscore:
  topk: [1, 3, 10]
  std_floor: 0.1

pca:
  variance: [0.9, 0.95, 0.99]

gru:
  seeds: [0, 1, 2]
  window: 60
  hidden: 128
  layers: 2
  dropout: 0.1
  lr: 0.001
  weight_decay: 0.0001
  batch_size: 512
  steps_per_epoch: 1000
  max_epochs: 60
  patience: 6
  lr_patience: 2
  lr_factor: 0.5
  max_minutes: 9
  clip: 10
  residual_floor: 0.0001
  topk: [1, 3, 10, all]
  eval_batch: 8192
  device: cuda
