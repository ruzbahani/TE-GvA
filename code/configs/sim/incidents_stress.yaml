warmup_s: 3600
onset_s: [600, 3600]
horizon_s: 21600
background:
  choices: [[], [8], [1]]
  weights: [0.2, 0.4, 0.4]
types:
  link_fault: 0.35
  io_module_fault: 0.35
  sensor_fault: 0.10
  disturbance: 0.20
io_module_fault:
  groups:
    reactor: 3
    stripper: 3
    feeds: 2
    separator: 0.5
    recycle: 0.5
    analyzers: 0.5
link_fault:
  links:
    sensor:reactor: 3
    sensor:stripper: 3
    sensor:feeds: 2
    actuator:reactor: 1.5
    actuator:separator: 1.5
    actuator:stripper: 1.5
    sensor:separator: 0.5
    sensor:recycle: 0.5
    sensor:analyzers: 0.5
    actuator:feeds: 0.5
    actuator:recycle: 0.5
sensor_fault:
  sensors: [reactor_temperature, reactor_temperature, reactor_temperature, reactor_pressure, reactor_level,
            stripper_level]
  kinds:
    frozen: {weight: 0.6}
    drift: {weight: 0.3, magnitude_rel_per_h: [0.02, 0.08]}
    bias: {weight: 0.1, magnitude_rel: [0.02, 0.06]}
disturbance:
  idv: [6, 6, 6, 1, 1, 2]
redraw_active_disturbance: true
backup_unavailable_prob: 0.5
