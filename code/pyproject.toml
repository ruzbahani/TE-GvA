[project]
name = "cpsdefense"
version = "0.1.0"
description = "Deadline-aware active cyber defense with direct decision models"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "torch>=2.3",
    "pyyaml>=6",
    "networkx>=3.2",
    "matplotlib>=3.8",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["cpsdefense*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "data: needs the raw or processed datasets under data/ (skipped when absent)",
    "slow: takes more than ~30 s",
    "gpu: needs CUDA",
]
